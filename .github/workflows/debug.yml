---
# Role-local diagnostic workflow; intentionally not generated by ansible-factory.
name: debug AlmaLinux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-almalinux:
    name: Debug quadlet on AlmaLinux
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      uns: jomrr
      img: almalinux
      tag: latest
      TERM: xterm-256color
      FORCE_COLOR: "1"
      CLICOLOR_FORCE: "1"
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "true"
      QUADLET_DEBUG_DIR: /tmp/quadlet-almalinux-debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          save-cache: false

      - name: Sync Python environment
        run: uv sync --only-group ansible --only-group podman

      - name: Install required Ansible Collections
        run: uv run ansible-galaxy collection install -r collections.yml

      - name: Run existing tests and retain the instance for diagnostics
        id: molecule
        timeout-minutes: 30
        run: |
          set -euo pipefail
          mkdir -p "$QUADLET_DEBUG_DIR"
          uv run molecule test -s default --destroy never 2>&1 | tee "$QUADLET_DEBUG_DIR/molecule.log"

      - name: Collect diagnostics before destroying the instance
        if: always()
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mkdir -p "$QUADLET_DEBUG_DIR"

          # A failed unit makes systemctl status exit nonzero; keep collecting.
          capture() {
            local name="$1"
            shift
            "$@" 2>&1 | tee "$QUADLET_DEBUG_DIR/$name.log" || true
          }

          capture host-kernel-journal sudo -n journalctl -k -b --no-pager
          capture host-apparmor-status sudo -n aa-status
          capture podman-info podman info
          capture container-inspect podman inspect quadlet
          capture container-logs podman logs --timestamps quadlet
          capture packages podman exec quadlet rpm -q systemd systemd-pam pam shadow-utils podman
          capture unit-status podman exec quadlet systemctl --no-pager --full status \
            user@901.service user-runtime-dir@901.service systemd-logind.service
          capture unit-config podman exec quadlet systemctl cat \
            user@901.service user-runtime-dir@901.service
          capture journal podman exec quadlet journalctl -b --no-pager -o short-precise \
            -u user@901.service -u user-runtime-dir@901.service -u systemd-logind.service

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quadlet-almalinux-debug
          path: "${{ env.QUADLET_DEBUG_DIR }}"
          if-no-files-found: error
          retention-days: 7

      - name: Destroy the test instance after collecting diagnostics
        if: always() && (steps.molecule.outcome == 'success' || steps.molecule.outcome == 'failure')
        timeout-minutes: 5
        run: uv run molecule destroy -s default
