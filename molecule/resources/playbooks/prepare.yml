---
# role: quadlet
# file: molecule/resources/playbooks/prepare.yml

- name: "Molecule | prepare | quadlet"
  hosts: all
  gather_facts: true
  tasks:
    - name: Verify the connection uses the unprivileged image user
      ansible.builtin.assert:
        that: ansible_facts.effective_user_id == 1001
        quiet: true

    - name: "QUADLET | Refresh APT metadata from the test image"
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == 'Debian'

    - name: "QUADLET | Refresh DNF package metadata"
      become: true
      become_user: root
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

    - name: "QUADLET | Refresh Zypper package metadata"
      become: true
      become_user: root
      community.general.zypper_repository:
        repo: '*'
        runrefresh: true
      when: ansible_facts.pkg_mgr == 'zypper'

    - name: Install ACL support for transfers between unprivileged users
      become: true
      become_user: root
      ansible.builtin.package:
        name: acl
        state: present

    - name: "QUADLET | Ensure nested Podman configuration directory exists"
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/containers/storage.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Configure storage before the role initializes Podman for service users.
    # The main file supports older Podman; the drop-in overrides newer vendor defaults.
    # This affects only the inner Podman, including systemd-started builds.
    - name: "QUADLET | Use VFS storage for nested Podman"
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/containers/{{ __quadlet_storage_config }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [storage]
          driver = "vfs"
      loop:
        - storage.conf
        - storage.conf.d/99-molecule.conf
      loop_control:
        loop_var: __quadlet_storage_config

    # Container networking is ready, but no network manager activates this target.
    # Quadlet builds wait for it through podman-user-wait-network-online.service.
    - name: "QUADLET | Mark test container networking online"
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: network-online.target
        state: started

    # Keep subordinate IDs inside the outer rootless container's mapping.
    # Create the /etc override when vendor defaults live under /usr/etc.
    # These test-only ranges support secrets, not arbitrary container images.
    # Shadow bug #1255 skips sub-IDs for explicit system UIDs on older versions:
    # https://github.com/shadow-maint/shadow/issues/1255
    # Fixed versions honor --add-subids-for-system and need usable nested ranges.
    - name: "QUADLET | Configure subordinate IDs for nested Podman"
      become: true
      become_user: root
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        create: true
        owner: root
        group: root
        mode: "0644"
        regexp: '^\s*{{ __quadlet_login_def.key }}\s+'
        line: "{{ __quadlet_login_def.key }} {{ __quadlet_login_def.value }}"
      loop:
        - { key: SUB_UID_MIN, value: 60001 }
        - { key: SUB_UID_MAX, value: 65535 }
        - { key: SUB_UID_COUNT, value: 1024 }
        - { key: SUB_GID_MIN, value: 60001 }
        - { key: SUB_GID_MAX, value: 65535 }
        - { key: SUB_GID_COUNT, value: 1024 }
      loop_control:
        loop_var: __quadlet_login_def
        label: "{{ __quadlet_login_def.key }}"

    - name: "QUADLET | Create image build test context"
      become: true
      become_user: root
      ansible.builtin.file:
        path: /srv/quadlet-build-test
        state: directory
        owner: root
        group: root
        mode: "0755"

    # No base image download or application container is needed for these builds.
    - name: "QUADLET | Prepare image build test Containerfile"
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /srv/quadlet-build-test/Containerfile
        owner: root
        group: root
        mode: "0644"
        content: |
          FROM scratch
          LABEL quadlet.test.revision="1"

    # These units exercise real start limits without application images.
    # Install before converge so the role creates and starts the test user.
    - name: "QUADLET | Create test user unit directory"
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/systemd/user
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "QUADLET | Install start-counting user services"
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/systemd/user/{{ __quadlet_test_unit }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          StartLimitIntervalSec=3600
          StartLimitBurst=1
          {% if __quadlet_test_unit == 'restart-test-group' %}
          Wants=restart-test-member.service restart-test-fileonly.service
          {% elif __quadlet_test_unit in ['restart-test-member', 'restart-test-fileonly'] %}
          PartOf=restart-test-group.service
          After=restart-test-group.service
          {% endif %}
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'echo start >> %h/%n.starts'
      loop: "{{ __quadlet_restart_test_units }}"
      loop_control:
        loop_var: __quadlet_test_unit
