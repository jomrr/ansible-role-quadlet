---
# role: quadlet
# file: molecule/resources/playbooks/prepare.yml

- name: "Molecule | prepare | quadlet"
  hosts: all
  gather_facts: true
  tasks:
    - name: "QUADLET | Refresh APT metadata from the test image"
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.os_family == 'Debian'

    - name: "QUADLET | Refresh DNF package metadata"
      become: true
      become_user: root
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_facts.pkg_mgr in ['dnf', 'dnf5']

    - name: "QUADLET | Refresh Zypper package metadata"
      become: true
      become_user: root
      community.general.zypper_repository:
        repo: '*'
        runrefresh: true
      when: ansible_facts.pkg_mgr == 'zypper'

    # Keep subordinate IDs inside the outer rootless container's mapping.
    # Create the /etc override when vendor defaults live under /usr/etc.
    # These test-only ranges support secrets, not arbitrary container images.
    # Shadow bug #1255 skips sub-IDs for explicit system UIDs on older versions:
    # https://github.com/shadow-maint/shadow/issues/1255
    # Fixed versions honor --add-subids-for-system and need usable nested ranges.
    - name: "QUADLET | Configure subordinate IDs for nested Podman"
      become: true
      become_user: root
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        create: true
        owner: root
        group: root
        mode: "0644"
        regexp: '^\s*{{ __quadlet_login_def.key }}\s+'
        line: "{{ __quadlet_login_def.key }} {{ __quadlet_login_def.value }}"
      loop:
        - { key: SUB_UID_MIN, value: 60001 }
        - { key: SUB_UID_MAX, value: 65535 }
        - { key: SUB_UID_COUNT, value: 1024 }
        - { key: SUB_GID_MIN, value: 60001 }
        - { key: SUB_GID_MAX, value: 65535 }
        - { key: SUB_GID_COUNT, value: 1024 }
      loop_control:
        loop_var: __quadlet_login_def
        label: "{{ __quadlet_login_def.key }}"

    # These units exercise real start limits without application images.
    # Install before converge so the role creates and starts the test user.
    - name: "QUADLET | Create test user unit directory"
      become: true
      become_user: root
      ansible.builtin.file:
        path: /etc/systemd/user
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "QUADLET | Install start-counting user services"
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: "/etc/systemd/user/{{ __quadlet_test_unit }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          StartLimitIntervalSec=3600
          StartLimitBurst=1
          {% if __quadlet_test_unit == 'restart-test-group' %}
          Wants=restart-test-member.service restart-test-fileonly.service
          {% elif __quadlet_test_unit in ['restart-test-member', 'restart-test-fileonly'] %}
          PartOf=restart-test-group.service
          After=restart-test-group.service
          {% endif %}
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'echo start >> %h/%n.starts'
      loop: "{{ __quadlet_restart_test_units }}"
      loop_control:
        loop_var: __quadlet_test_unit
