---
# role: quadlet
# file: molecule/resources/playbooks/verify.yml

- name: "Molecule | verify | quadlet"
  hosts: all
  gather_facts: true
  vars:
    __quadlet_verify_vikunja_pod: /etc/containers/systemd/users/901/vikunja.pod
    __quadlet_verify_vikunja_quadlet: /etc/containers/systemd/users/901/vikunja.container
    __quadlet_verify_vaultwarden_quadlet: /etc/containers/systemd/users/901/vaultwarden.container
    __quadlet_verify_vikunja_env: /srv/containers/vikunja/env/vikunja.env
    __quadlet_verify_vaultwarden_env: /srv/containers/vaultwarden/env/vaultwarden.env
    __quadlet_verify_drop_in: /var/lib/quadlet_vikunja/.config/containers/containers.conf.d/90-quadlet.conf
    __quadlet_verify_vikunja_linger: /var/lib/systemd/linger/quadlet_vikunja
    __quadlet_verify_vaultwarden_exec_start_pre: >-
      ExecStartPre=/bin/bash -c 'until pg_isready -h POSTGRES_PUBLIC_IP -p 5432 -U vaultwarden; do sleep 10; done;'
  tasks:
    - name: "QUADLET | Stat Vikunja Pod Quadlet"
      ansible.builtin.stat:
        path: "{{ __quadlet_verify_vikunja_pod }}"
      register: __quadlet_verify_vikunja_pod_stat

    - name: "QUADLET | Stat Vikunja Quadlet"
      ansible.builtin.stat:
        path: "{{ __quadlet_verify_vikunja_quadlet }}"
      register: __quadlet_verify_vikunja_quadlet_stat

    - name: "QUADLET | Stat Vaultwarden Quadlet"
      ansible.builtin.stat:
        path: "{{ __quadlet_verify_vaultwarden_quadlet }}"
      register: __quadlet_verify_vaultwarden_quadlet_stat

    - name: "QUADLET | Assert Quadlets are root-owned user Quadlets"
      ansible.builtin.assert:
        that:
          - __quadlet_verify_vikunja_pod_stat.stat.uid == 0
          - __quadlet_verify_vikunja_pod_stat.stat.gid == 0
          - __quadlet_verify_vikunja_pod_stat.stat.mode == '0644'
          - __quadlet_verify_vikunja_quadlet_stat.stat.uid == 0
          - __quadlet_verify_vikunja_quadlet_stat.stat.gid == 0
          - __quadlet_verify_vikunja_quadlet_stat.stat.mode == '0644'
          - __quadlet_verify_vaultwarden_quadlet_stat.stat.uid == 0
          - __quadlet_verify_vaultwarden_quadlet_stat.stat.gid == 0
          - __quadlet_verify_vaultwarden_quadlet_stat.stat.mode == '0644'

    - name: "QUADLET | Stat EnvironmentFiles"
      become: true
      become_user: quadlet_vikunja
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __quadlet_verify_env_stats
      loop:
        - "{{ __quadlet_verify_vikunja_env }}"
        - "{{ __quadlet_verify_vaultwarden_env }}"

    - name: "QUADLET | Assert EnvironmentFile permissions"
      ansible.builtin.assert:
        that:
          - item.stat.uid == 0
          - item.stat.mode == '0640'
      loop: "{{ __quadlet_verify_env_stats.results }}"
      loop_control:
        label: "{{ item.stat.path }}"

    - name: Record the installed drop-in before trying an invalid update
      become: true
      become_user: quadlet_vikunja
      ansible.builtin.stat:
        path: "{{ __quadlet_verify_drop_in }}"
      register: __quadlet_original_drop_in

    - name: Try updating the installed drop-in with an invalid Podman option
      block:
        - name: Apply an invalid replacement for the service user
          ansible.builtin.include_role:
            name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
          vars:
            quadlet_users:
              - name: quadlet_vikunja
                uid: 901
                containers_conf:
                  engine:
                    healthcheck_events: not-a-boolean

        - name: Report unexpected acceptance of the invalid drop-in
          ansible.builtin.fail:
            msg: Podman accepted an invalid healthcheck_events value.
      rescue:
        - name: Verify Podman rejected the candidate for the expected reason
          ansible.builtin.assert:
            that: "'healthcheck_events' in ansible_failed_result.stderr | default('')"
            quiet: true

    - name: Read the drop-in metadata after rejection
      become: true
      become_user: quadlet_vikunja
      ansible.builtin.stat:
        path: "{{ __quadlet_verify_drop_in }}"
      register: __quadlet_retained_drop_in

    - name: Verify the service user retains the original private drop-in
      ansible.builtin.assert:
        that:
          - __quadlet_retained_drop_in.stat.uid == 901
          - __quadlet_retained_drop_in.stat.mode == '0600'
          - __quadlet_retained_drop_in.stat.checksum == __quadlet_original_drop_in.stat.checksum
        quiet: true

    - name: "QUADLET | Read generated files"
      become: true
      become_user: quadlet_vikunja
      ansible.builtin.slurp:
        src: "{{ __quadlet_file.path }}"
      register: __quadlet_verify_files
      loop:
        - path: "{{ __quadlet_verify_vikunja_pod }}"
          lines:
            - PublishPort=127.0.0.1:3456:3456
            - Network=pasta
            - PodName=molecule-vikunja-pod
        - path: "{{ __quadlet_verify_vikunja_quadlet }}"
          lines:
            - AutoUpdate=disabled
            - Secret=vikunja_db_password
            - Secret=vikunja_service_secret
            - Pod=vikunja.pod
            - StartWithPod=true
        - path: "{{ __quadlet_verify_vaultwarden_quadlet }}"
          lines:
            - Secret=vaultwarden_admin_token,type=env,target=ADMIN_TOKEN
            - "{{ __quadlet_verify_vaultwarden_exec_start_pre }}"
            - Restart=on-failure
            - RestartSec=10s
            - TimeoutStartSec=300
            - Exec=serve
            - AutoUpdate=local
            - HealthCmd=/bin/true
            - WantedBy=default.target
        - path: /etc/containers/systemd/users/901/vaultwarden-disabled.container
          lines:
            - AutoUpdate=disabled
        - path: /var/lib/quadlet_vikunja/.config/systemd/user/vaultwarden-build.timer
          lines:
            - OnCalendar=*-*-* 03:15:00
            - RandomizedDelaySec=0
        - path: /var/lib/quadlet_vikunja/.config/systemd/user/external-build.timer
          lines:
            - OnCalendar=weekly
            - RandomizedDelaySec=900
        - path: "{{ __quadlet_verify_drop_in }}"
          lines:
            - '[engine]'
            - 'healthcheck_events = false'
        - path: "{{ __quadlet_verify_vikunja_env }}"
          lines:
            - VIKUNJA_DATABASE_PASSWORD_FILE=/run/secrets/vikunja_db_password
            - VIKUNJA_SERVICE_SECRET_FILE=/run/secrets/vikunja_service_secret
            - VIKUNJA_SERVICE_NAME=Grüße
        - path: "{{ __quadlet_verify_vaultwarden_env }}"
          lines: []
      loop_control:
        loop_var: __quadlet_file
        label: "{{ __quadlet_file.path }}"

    - name: "QUADLET | Verify generated file contents"
      ansible.builtin.assert:
        that:
          - >-
            __quadlet_result.__quadlet_file.lines
            | difference((__quadlet_result.content | b64decode).splitlines())
            | length == 0
          - "'molecule-db-secret' not in (__quadlet_result.content | b64decode)"
          - "'molecule-service-secret' not in (__quadlet_result.content | b64decode)"
          - "'molecule-admin-token' not in (__quadlet_result.content | b64decode)"
        fail_msg: "Unexpected content in {{ __quadlet_result.source }}"
      loop: "{{ __quadlet_verify_files.results }}"
      loop_control:
        loop_var: __quadlet_result
        label: "{{ __quadlet_result.source }}"

    - name: "QUADLET | Stat service user linger markers"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __quadlet_verify_linger_markers
      loop:
        - "{{ __quadlet_verify_vikunja_linger }}"

    - name: "QUADLET | Assert service user linger is enabled"
      ansible.builtin.assert:
        that:
          - item.stat.exists
      loop: "{{ __quadlet_verify_linger_markers.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "QUADLET | Stat forbidden home Quadlet paths"
      become: true
      become_user: quadlet_vikunja
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __quadlet_verify_home_quadlets
      loop:
        - /var/lib/quadlet_vikunja/.config/containers/systemd/vikunja.pod
        - /var/lib/quadlet_vikunja/.config/containers/systemd/vikunja.container
        - /var/lib/quadlet_vikunja/.config/containers/systemd/vaultwarden.container

    - name: "QUADLET | Assert no Quadlets are placed below service-user homes"
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ __quadlet_verify_home_quadlets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "QUADLET | Stat forbidden rootful Quadlet paths"
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __quadlet_verify_rootful_quadlets
      loop:
        - /etc/containers/systemd/vikunja.pod
        - /etc/containers/systemd/vikunja.container
        - /etc/containers/systemd/vaultwarden.container

    - name: "QUADLET | Assert rootful Quadlet directory is not used"
      ansible.builtin.assert:
        that:
          - not item.stat.exists
      loop: "{{ __quadlet_verify_rootful_quadlets.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "QUADLET | Read user timer states"
      become: true
      become_user: quadlet_vikunja
      ansible.builtin.command:
        argv:
          - systemctl
          - --user
          - show
          - "{{ __quadlet_timer.name }}"
          - --property=ActiveState,UnitFileState
      environment:
        XDG_RUNTIME_DIR: /run/user/901
        DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/901/bus
      changed_when: false
      register: __quadlet_timer_status
      loop:
        - name: podman-auto-update.timer
          active: inactive
          enabled: disabled
        - name: vaultwarden-build.timer
          active: active
          enabled: enabled
      loop_control:
        loop_var: __quadlet_timer
        label: "{{ __quadlet_timer.name }}"

    - name: "QUADLET | Assert requested user timer states"
      ansible.builtin.assert:
        that:
          - "'ActiveState=' ~ __quadlet_result.__quadlet_timer.active in __quadlet_result.stdout_lines"
          - "'UnitFileState=' ~ __quadlet_result.__quadlet_timer.enabled in __quadlet_result.stdout_lines"
        quiet: true
        fail_msg: "Unexpected state for {{ __quadlet_result.__quadlet_timer.name }}"
      loop: "{{ __quadlet_timer_status.results }}"
      loop_control:
        loop_var: __quadlet_result
        label: "{{ __quadlet_result.__quadlet_timer.name }}"

    - name: "QUADLET | Verify initial image build and rebuild"
      ansible.builtin.include_tasks: ../tasks/build-case.yml
      loop: [1, 2]
      loop_control:
        loop_var: __quadlet_build_revision

    - name: "QUADLET | Verify deployment restart behavior"
      ansible.builtin.import_tasks: ../tasks/restarts.yml

    # Keep this last: older systemd-analyze versions replace the live user manager socket.
    - name: "QUADLET | Verify generated user units"
      become: true
      become_user: "{{ item.user }}"
      ansible.builtin.command:
        argv: "{{ ['systemd-analyze', '--user', '--generators=true', 'verify'] + item.units }}"
      environment:
        HOME: "{{ item.home }}"
        XDG_RUNTIME_DIR: "/run/user/{{ item.uid }}"
      changed_when: false
      loop:
        - user: quadlet_vikunja
          uid: 901
          home: /var/lib/quadlet_vikunja
          units:
            - vikunja-pod.service
            - vikunja.service
            - vaultwarden.service
            - vaultwarden-disabled.service
            - vaultwarden-build.service
            - vaultwarden-build.timer
            - external-build.service
            - external-build.timer
            - podman-image-prune.service
            - podman-image-prune.timer
      loop_control:
        label: "{{ item.user }}"
