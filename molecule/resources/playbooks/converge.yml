---
# role: quadlet
# file: molecule/resources/playbooks/converge.yml

- name: "Molecule | converge | quadlet"
  hosts: all
  gather_facts: true
  pre_tasks:
    - name: "Quadlet | Ensure local Podman stub directory exists"
      ansible.builtin.file:
        path: /usr/local/bin
        owner: root
        group: root
        mode: "0755"
        state: directory

    - name: "Quadlet | Install local Podman secret stub"
      ansible.builtin.copy:
        dest: /usr/local/bin/podman
        owner: root
        group: root
        mode: "0755"
        content: |-
          #!/bin/sh
          set -eu

          store="${HOME:-/tmp}/.local/share/molecule-podman-secrets"

          if [ "${1:-}" = "secret" ]; then
              action="${2:-}"
              name="${3:-}"

              case "${action}" in
                  exists)
                      test -f "${store}/${name}"
                      ;;
                  create)
                      mkdir -p "${store}"
                      if [ "${4:-}" = "-" ]; then
                          cat > "${store}/${name}"
                      else
                          cp "${4}" "${store}/${name}"
                      fi
                      ;;
                  rm)
                      rm -f "${store}/${name}"
                      ;;
                  *)
                      echo "Unsupported podman secret action: ${action}" >&2
                      exit 2
                      ;;
              esac
              exit 0
          fi

          echo "Unsupported podman stub call" >&2
          exit 2

    - name: "Quadlet | Ensure molecule secret fixture directory exists"
      ansible.builtin.file:
        path: /tmp/molecule-quadlet-secrets
        owner: root
        group: root
        mode: "0700"
        state: directory

    - name: "Quadlet | Write molecule secret fixtures"
      ansible.builtin.copy:
        dest: "/tmp/molecule-quadlet-secrets/{{ item.name }}"
        owner: root
        group: root
        mode: "0600"
        content: "{{ item.value }}"
      loop:
        - name: vikunja_db_password
          value: molecule-db-secret
        - name: vikunja_service_secret
          value: molecule-service-secret
        - name: vaultwarden_admin_token
          value: molecule-admin-token
      loop_control:
        label: "{{ item.name }}"
      no_log: true

  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
