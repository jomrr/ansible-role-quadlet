---
# role: quadlet
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
  inventory:
    group_vars:
      all:
        quadlet_users:
          - name: "quadlet_vikunja"
            uid: 901
            pods:
              - name: "vikunja"
                ports:
                  - "127.0.0.1:3456:3456"
                networks:
                  - "pasta"
                pod_options:
                  PodName: "molecule-vikunja-pod"
                state: "created"
            containers:
              - name: "vikunja"
                image: "localhost/vikunja:test"
                container_name: "vikunja"
                pod: "vikunja"
                environment_file: "/srv/containers/vikunja/env/vikunja.env"
                environment:
                  VIKUNJA_DATABASE_TYPE: "postgres"
                  VIKUNJA_DATABASE_PASSWORD_FILE: "/run/secrets/vikunja_db_password"
                  VIKUNJA_SERVICE_SECRET_FILE: "/run/secrets/vikunja_service_secret"
                  VIKUNJA_SERVICE_NAME: "Grüße"
                secrets:
                  - name: "vikunja_db_password"
                    value: "molecule-db-secret"
                  - name: "vikunja_service_secret"
                    value: "molecule-service-secret"
                volumes:
                  - "/srv/containers/vikunja/data:/app/vikunja/files:Z"
                enabled: false
                state: "created"
              - name: "vaultwarden"
                image: "localhost/vaultwarden:test"
                container_name: "vaultwarden"
                environment_file: "/srv/containers/vaultwarden/env/vaultwarden.env"
                environment:
                  DOMAIN: "http://vaultwarden.example.invalid"
                  SIGNUPS_ALLOWED: "false"
                secrets:
                  - name: "vaultwarden_admin_token"
                    type: "env"
                    env_target: "ADMIN_TOKEN"
                    value: "molecule-admin-token"
                volumes:
                  - "/srv/containers/vaultwarden/data:/data:Z"
                ports:
                  - "127.0.0.1:8080:80"
                exec: "serve"
                auto_update: "local"
                container_options:
                  HealthCmd: "/bin/true"
                restart_policy: "on-failure"
                service_options:
                  ExecStartPre: "/bin/bash -c 'until pg_isready -h POSTGRES_PUBLIC_IP -p 5432 -U vaultwarden; do sleep 10;\
                    \ done;'"
                  RestartSec: "10s"
                  TimeoutStartSec: "300"
                install_options:
                  WantedBy: "default.target"
                state: "created"
verifier:
  name: "ansible"
scenario:
  name: "dev"
platforms:
  - name: "almalinux-latest-quadlet"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "debian-latest-quadlet"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "fedora-latest-quadlet"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-leap-latest-quadlet"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "opensuse-tumbleweed-latest-quadlet"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
  - name: "ubuntu-latest-quadlet"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
