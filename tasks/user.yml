---
# role: quadlet
# file: tasks/user.yml

- name: "QUADLET | Ensure service group exists"
  become: true
  become_user: root
  ansible.builtin.group:
    name: "{{ __quadlet_user.name }}"
    system: true
    state: present

- name: "QUADLET | Create service user with subordinate IDs"
  become: true
  become_user: root
  ansible.builtin.command:
    cmd: >-
      useradd --system --add-subids-for-system --gid {{ __quadlet_user.name }}
      {{ '--uid ' ~ __quadlet_user.uid if __quadlet_user.uid is defined else '' }}
      {{ __quadlet_user.name }}
  register: __quadlet_useradd
  changed_when: __quadlet_useradd.rc == 0
  failed_when: __quadlet_useradd.rc not in [0, 9]

- name: "QUADLET | Manage service user"
  become: true
  become_user: root
  ansible.builtin.user:
    name: "{{ __quadlet_user.name }}"
    uid: "{{ __quadlet_user.uid | default(omit) }}"
    home: "{{ __quadlet_user.home | default('/var/lib/' ~ __quadlet_user.name) }}"
    shell: "{{ __quadlet_user.shell | default('/usr/sbin/nologin') }}"
    group: "{{ __quadlet_user.name }}"
    create_home: true
    state: present
  register: __quadlet_service_user

- name: "QUADLET | Configure service user resources"
  when: not ansible_check_mode or __quadlet_service_user.uid is defined
  block:
    - name: "QUADLET | Initialize service user state"
      ansible.builtin.set_fact:
        __quadlet_handler_user:
          name: "{{ __quadlet_user.name }}"
          pods: >-
            {{
              __quadlet_user.pods | default([])
              | map('dict2items')
              | map('selectattr', 'key', 'in', ['name', 'service_name', 'state'])
              | map('items2dict')
              | list
            }}
          containers: >-
            {{
              __quadlet_user.containers | default([])
              | map('dict2items')
              | map('selectattr', 'key', 'in', ['name', 'state', 'pod', 'start_with_pod'])
              | map('items2dict')
              | list
            }}
        __quadlet_user_systemd_env:
          DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ __quadlet_service_user.uid }}/bus"
          HOME: "{{ __quadlet_user.home | default('/var/lib/' ~ __quadlet_user.name) }}"
          XDG_RUNTIME_DIR: "/run/user/{{ __quadlet_service_user.uid }}"

    - name: "QUADLET | Ensure rootless user Quadlet directories exist"
      become: true
      become_user: root
      ansible.builtin.file:
        path: "{{ __quadlet_directory }}"
        owner: root
        group: root
        mode: "0755"
        state: directory
      loop:
        - /etc/containers/systemd/users
        - "/etc/containers/systemd/users/{{ __quadlet_service_user.uid }}"
      loop_control:
        loop_var: __quadlet_directory

    - name: "QUADLET | Enable linger for service user"
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - loginctl
          - enable-linger
          - "{{ __quadlet_user.name }}"
        creates: "/var/lib/systemd/linger/{{ __quadlet_user.name }}"

    - name: "QUADLET | Ensure user manager is running"
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: "user@{{ __quadlet_service_user.uid }}.service"
        state: started

    # Render once so the bytes Podman validates are exactly the bytes installed.
    - name: "user | Configure rootless Podman options"
      ansible.builtin.include_tasks: containers_conf.yml
      vars:
        __quadlet_containers_conf: "{{ __quadlet_user.containers_conf | default(quadlet_containers_conf) }}"
        __quadlet_conf_path: "{{ __quadlet_service_user.home }}/.config/containers/containers.conf.d/90-quadlet.conf"
      loop: "{{ query('ansible.builtin.template', 'containers.conf.j2', template_vars={'template_destpath': __quadlet_conf_path}) }}"
      loop_control:
        loop_var: __quadlet_conf_content
        label: "{{ __quadlet_user.name }}"
      when: __quadlet_containers_conf | length > 0

    - name: "QUADLET | Configure image builds"
      ansible.builtin.include_tasks: build.yml
      loop: "{{ __quadlet_user.builds | default([]) }}"
      loop_control:
        loop_var: __quadlet_build
        label: "{{ __quadlet_build.name }}"

    - name: "QUADLET | Render user pods"
      ansible.builtin.import_tasks: pod.yml

    - name: "QUADLET | Render containers for service user"
      ansible.builtin.include_tasks: container.yml
      loop: "{{ __quadlet_user.containers | default([]) }}"
      loop_control:
        loop_var: __quadlet_container
        label: "{{ __quadlet_container.name }}"

    - name: "QUADLET | Ensure user unit directory exists"
      become: true
      become_user: "{{ __quadlet_user.name }}"
      ansible.builtin.file:
        path: "{{ __quadlet_service_user.home }}/.config/systemd/user"
        mode: "0755"
        state: directory

    - name: "QUADLET | Render image rebuild timers"
      become: true
      become_user: "{{ __quadlet_user.name }}"
      ansible.builtin.template:
        src: build.timer.j2
        dest: "{{ __quadlet_service_user.home }}/.config/systemd/user/{{ __quadlet_build.name }}-build.timer"
        mode: "0644"
      loop: "{{ __quadlet_user.builds | default([]) }}"
      loop_control:
        loop_var: __quadlet_build
        label: "{{ __quadlet_build.name }}"
      notify: "reload user manager"
      register: __quadlet_build_timers

    - name: "QUADLET | Render Podman image prune units"
      become: true
      become_user: "{{ __quadlet_user.name }}"
      ansible.builtin.template:
        src: "{{ __quadlet_prune_unit }}.j2"
        dest: "{{ __quadlet_service_user.home }}/.config/systemd/user/{{ __quadlet_prune_unit }}"
        mode: "0644"
      loop:
        - podman-image-prune.service
        - podman-image-prune.timer
      loop_control:
        loop_var: __quadlet_prune_unit
      notify: "reload user manager"
      register: __quadlet_prune_units

    - name: "QUADLET | Apply user service changes"
      ansible.builtin.meta: flush_handlers

    - name: "QUADLET | Manage user services"
      ansible.builtin.import_tasks: service.yml
