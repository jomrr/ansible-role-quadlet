---
# role: quadlet
# file: tasks/assert.yml

- name: "QUADLET | Validate pod install options"
  ansible.builtin.assert:
    that:
      - >-
        __quadlet_pod.enabled | default(true) | bool
        or 'WantedBy' not in (__quadlet_pod.install_options | default({}))
    quiet: true
    fail_msg: >-
      quadlet_users[].pods[].install_options.WantedBy cannot be set when enabled is false.
  loop: "{{ __quadlet_user.pods | default([]) }}"
  loop_control:
    loop_var: __quadlet_pod
    label: "{{ __quadlet_pod.name }}"

- name: "QUADLET | Validate reserved pod option keys"
  ansible.builtin.assert:
    that:
      - >-
        not (__quadlet_reserved_pod_options
        | intersect(__quadlet_pod.pod_options | default({}) | list))
      - >-
        not (__quadlet_reserved_service_options
        | intersect(__quadlet_pod.service_options | default({}) | list))
    quiet: true
    fail_msg: >-
      Pod option maps cannot redefine a single-value key managed directly by the role.
  loop: "{{ __quadlet_user.pods | default([]) }}"
  loop_control:
    loop_var: __quadlet_pod
    label: "{{ __quadlet_pod.name }}"
