---
# role: quadlet
# file: tasks/assert.yml

- name: "QUADLET | Validate build names and Containerfile paths"
  ansible.builtin.assert:
    that:
      - __quadlet_build.name is match('^[a-z0-9]+(?:(?:[._]|__|-+)[a-z0-9]+)*\Z')
      - __quadlet_build.containerfile is match('^/[^\r\n\x00]+\Z')
    fail_msg: >-
      Build {{ __quadlet_build.name }}: builds[].name must be a lowercase image name without
      slashes or whitespace; builds[].containerfile must be an absolute path without line breaks or NUL bytes.
    quiet: true
  loop: "{{ __quadlet_user.builds | default([]) }}"
  loop_control:
    loop_var: __quadlet_build
    label: "{{ __quadlet_build.name }}"

- name: "QUADLET | Validate Quadlet file names"
  ansible.builtin.assert:
    that:
      - __quadlet_name not in ['', '.', '..']
      - __quadlet_name == (__quadlet_name | basename)
    fail_msg: "Quadlet names must be non-empty file names, not paths."
    quiet: true
  loop: >-
    {{
      ((__quadlet_user.pods | default([])) + (__quadlet_user.containers | default([])))
      | map(attribute='name')
    }}
  loop_control:
    loop_var: __quadlet_name
    label: "{{ __quadlet_name }}"

- name: "QUADLET | Validate pod install options"
  ansible.builtin.assert:
    that:
      - >-
        __quadlet_pod.enabled | default(true) | bool
        or 'WantedBy' not in (__quadlet_pod.install_options | default({}))
    quiet: true
    fail_msg: >-
      quadlet_users[].pods[].install_options.WantedBy cannot be set when enabled is false.
  loop: "{{ __quadlet_user.pods | default([]) }}"
  loop_control:
    loop_var: __quadlet_pod
    label: "{{ __quadlet_pod.name }}"

- name: "QUADLET | Validate reserved pod option keys"
  ansible.builtin.assert:
    that:
      - >-
        not (__quadlet_reserved_pod_options
        | intersect(__quadlet_pod.pod_options | default({}) | list))
      - >-
        not (__quadlet_reserved_service_options
        | intersect(__quadlet_pod.service_options | default({}) | list))
    quiet: true
    fail_msg: >-
      Pod option maps cannot redefine a single-value key managed directly by the role.
  loop: "{{ __quadlet_user.pods | default([]) }}"
  loop_control:
    loop_var: __quadlet_pod
    label: "{{ __quadlet_pod.name }}"
