---
# role: quadlet
# file: tasks/secret.yml

- name: "Quadlet | Set secret facts"
  ansible.builtin.set_fact:
    __quadlet_secret_type: "{{ quadlet_secret.type | default('mount') }}"
    __quadlet_secret_has_value: "{{ quadlet_secret.value is defined }}"
    __quadlet_secret_has_value_file: "{{ quadlet_secret.value_file is defined }}"
    __quadlet_secret_recreate: "{{ quadlet_secret.recreate | default(false) | bool }}"
  no_log: true

- name: "Quadlet | Validate secret"
  ansible.builtin.assert:
    that:
      - quadlet_secret.name is defined
      - quadlet_secret.name | length > 0
      - __quadlet_secret_type in ['mount', 'env']
      - __quadlet_secret_type != 'env' or quadlet_secret.env_target is defined
      - __quadlet_secret_type != 'env' or quadlet_secret.env_target not in __quadlet_container_environment
      - not (__quadlet_secret_has_value | bool and __quadlet_secret_has_value_file | bool)
      - >-
        not (__quadlet_secret_has_value | bool)
        or quadlet_secret.value not in (
          __quadlet_container_environment
          | dict2items
          | map(attribute='value')
          | map('string')
          | list
        )
    fail_msg: "Each secret needs a name; type must be mount or env; type env needs env_target; value and value_file are mutually exclusive."
  no_log: true

- name: "Quadlet | Check rootless Podman secret"
  become: true
  become_user: "{{ __quadlet_user_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - exists
      - "{{ quadlet_secret.name }}"
  environment:
    HOME: "{{ __quadlet_user_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ __quadlet_user_uid }}"
  register: __quadlet_secret_exists
  changed_when: false
  failed_when: __quadlet_secret_exists.rc not in [0, 1]
  when: (__quadlet_secret_has_value | bool) or (__quadlet_secret_has_value_file | bool)
  no_log: true

- name: "Quadlet | Remove rootless Podman secret for recreation"
  become: true
  become_user: "{{ __quadlet_user_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - rm
      - "{{ quadlet_secret.name }}"
  environment:
    HOME: "{{ __quadlet_user_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ __quadlet_user_uid }}"
  changed_when: true
  when:
    - (__quadlet_secret_has_value | bool) or (__quadlet_secret_has_value_file | bool)
    - __quadlet_secret_recreate | bool
    - __quadlet_secret_exists.rc == 0
  no_log: true

- name: "Quadlet | Read rootless Podman secret value file"
  ansible.builtin.slurp:
    src: "{{ quadlet_secret.value_file }}"
  register: __quadlet_secret_value_file
  when:
    - __quadlet_secret_has_value_file | bool
    - __quadlet_secret_recreate | bool or __quadlet_secret_exists.rc == 1
  no_log: true

- name: "Quadlet | Create rootless Podman secret from value"
  become: true
  become_user: "{{ __quadlet_user_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - create
      - "{{ quadlet_secret.name }}"
      - "-"
    stdin: "{{ quadlet_secret.value }}"
  environment:
    HOME: "{{ __quadlet_user_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ __quadlet_user_uid }}"
  changed_when: true
  when:
    - __quadlet_secret_has_value | bool
    - __quadlet_secret_recreate | bool or __quadlet_secret_exists.rc == 1
  no_log: true

- name: "Quadlet | Create rootless Podman secret from value file"
  become: true
  become_user: "{{ __quadlet_user_name }}"
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - create
      - "{{ quadlet_secret.name }}"
      - "-"
    stdin: "{{ __quadlet_secret_value_file.content | b64decode }}"
  environment:
    HOME: "{{ __quadlet_user_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ __quadlet_user_uid }}"
  changed_when: true
  when:
    - __quadlet_secret_has_value_file | bool
    - __quadlet_secret_recreate | bool or __quadlet_secret_exists.rc == 1
  no_log: true
