---
# role: quadlet
# file: tasks/main.yml

- name: "QUADLET | Validate service user configuration"
  ansible.builtin.include_tasks: assert.yml
  loop: "{{ quadlet_users }}"
  loop_control:
    loop_var: __quadlet_user
    label: "{{ __quadlet_user.name }}"

- name: "QUADLET | Load platform packages"
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', __quadlet_platform_files) }}"
  vars:
    __quadlet_platform_files:
      files:
        - "{{ ansible_facts.distribution }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"

- name: "QUADLET | Install packages"
  become: true
  become_user: root
  ansible.builtin.package:
    name: "{{ __quadlet_packages + __quadlet_platform_packages }}"
    state: present

- name: "QUADLET | Manage service users"
  ansible.builtin.include_tasks: user.yml
  loop: "{{ quadlet_users }}"
  loop_control:
    loop_var: __quadlet_user
    label: "{{ __quadlet_user.name }}"
