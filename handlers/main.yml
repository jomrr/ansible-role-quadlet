---
# role: quadlet
# file: handlers/main.yml

- name: "QUADLET | Reload user systemd manager"
  become: true
  become_user: "{{ __quadlet_handler_user.name }}"
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
  environment: "{{ __quadlet_user_systemd_env }}"
  listen: "reload user manager"

- name: "QUADLET | Restart user services"
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/restart.yml"
  vars:
    __quadlet_restart_pods: >-
      {{ (__quadlet_handler_user.pods | rejectattr('state', 'defined') | list)
         + (__quadlet_handler_user.pods | selectattr('state', 'defined') | selectattr('state', 'equalto', 'started') | list) }}
    __quadlet_restart_with_pod: >-
      {{ (__quadlet_container.start_with_pod | default(true) | bool)
         and (__quadlet_container.pod | default('') | regex_replace('[.]pod$', ''))
         in (__quadlet_restart_pods | map(attribute='name')) }}
  listen: "restart user services"
