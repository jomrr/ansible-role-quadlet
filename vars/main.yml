---
# role: quadlet
# file: vars/main.yml

# Internal packages required to render and run rootless Podman Quadlets.
__quadlet_packages:
  - podman

# Single-value container keys rendered directly by the role.
__quadlet_reserved_container_options:
  - Image
  - ContainerName
  - Pod
  - StartWithPod
  - EnvironmentFile
  - ReadOnly
  - ReadOnlyTmpfs
  - NoNewPrivileges
  - PidsLimit
  - Exec
  - AutoUpdate

# Single-value pod keys rendered directly by the role.
__quadlet_reserved_pod_options:
  - ServiceName

# Single-value service keys rendered directly by the role.
__quadlet_reserved_service_options:
  - Restart
