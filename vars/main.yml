---
# role: quadlet
# file: vars/main.yml

# Load the candidate after the user's other Podman configuration without starting a container.
__quadlet_validate_config: /usr/bin/env CONTAINERS_CONF_OVERRIDE=%s /usr/bin/podman --help

# Internal packages required to render and run rootless Podman Quadlets.
__quadlet_packages:
  - podman
  - fuse-overlayfs

# Single-value container keys rendered directly by the role.
__quadlet_reserved_container_options:
  - Image
  - ContainerName
  - Pod
  - StartWithPod
  - EnvironmentFile
  - ReadOnly
  - ReadOnlyTmpfs
  - NoNewPrivileges
  - PidsLimit
  - Exec
  - AutoUpdate

# Single-value pod keys rendered directly by the role.
__quadlet_reserved_pod_options:
  - ServiceName

# Single-value service keys rendered directly by the role.
__quadlet_reserved_service_options:
  - Restart
