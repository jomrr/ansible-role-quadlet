---
# role: quadlet
# file: meta/argument_specs.yml

argument_specs:
  main:
    short_description: Deploy rootless Podman Quadlet application services
    description:
      - Creates dedicated Unix service users for rootless Podman application pods and containers.
      - Uses `useradd --add-subids-for-system` so shadow-utils allocates subordinate IDs
        from system defaults.
      - Renders root-owned user Quadlet files below `/etc/containers/systemd/users/<UID>/`.
      - Manages non-secret EnvironmentFiles and rootless Podman secret references.
      - Reloads user managers and restarts changed services when required.
    options:
      quadlet_base_dir:
        type: path
        required: false
        default: /srv/containers
        description: Base directory for default container data paths.
      quadlet_autoupdate:
        type: str
        required: false
        default: registry
        choices:
          - registry
          - local
        description: Podman auto-update policy rendered for every container.
      quadlet_autoupdate_timer:
        type: bool
        required: false
        default: true
        description: Whether the Podman auto-update timer is enabled for service users.
      quadlet_users:
        type: list
        elements: dict
        required: false
        default: []
        description: Service users and rootless Podman Quadlets managed by this role.
        options:
          name:
            type: str
            required: true
            description: Dedicated Unix service user name.
          uid:
            type: int
            required: false
            description: Optional numeric UID for the service user.
          home:
            type: path
            required: false
            description: Service user home directory. Defaults to `/var/lib/<name>`.
          shell:
            type: str
            required: false
            default: /usr/sbin/nologin
            description: Login shell for the service user.
          pods:
            type: list
            elements: dict
            required: false
            default: []
            description: Rootless Podman pod Quadlets managed for this service user.
            options:
              name:
                type: str
                required: true
                description: Quadlet pod unit base name. The generated service defaults
                  to `<name>-pod.service`.
              service_name:
                type: str
                required: false
                description: Optional Quadlet `ServiceName=` override without the `.service`
                  suffix.
              ports:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `PublishPort=` values.
              networks:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `Network=` values.
              volumes:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `Volume=` values.
              restart_policy:
                type: str
                required: false
                default: always
                description: Systemd `Restart=` policy written to the pod Quadlet `[Service]`
                  section.
              unit_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Unit]` keys; list values render the key repeatedly.
              pod_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Pod]` keys; list values render the key repeatedly.
              service_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Service]` keys; list values render the key repeatedly.
              install_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Install]` keys; list values render the key repeatedly.
              state:
                type: str
                required: false
                default: started
                choices:
                  - created
                  - reloaded
                  - restarted
                  - started
                  - stopped
                description: User pod service runtime state. `created` renders files without
                  managing the service.
              enabled:
                type: bool
                required: false
                default: true
                description: Whether `[Install]` enables the generated pod service.
          containers:
            type: list
            elements: dict
            required: false
            default: []
            description: Rootless Podman containers managed for this service user.
            options:
              name:
                type: str
                required: true
                description: Quadlet unit base name. The generated service is `<name>.service`.
              image:
                type: str
                required: true
                description: Container image reference written to `Image=`.
              container_name:
                type: str
                required: false
                description: Podman container name. Defaults to `name`.
              pod:
                type: str
                required: false
                description: Optional pod Quadlet reference. Values without `.pod` are rendered
                  as `<pod>.pod`.
              start_with_pod:
                type: bool
                required: false
                default: true
                description: Value for Quadlet `StartWithPod=` when `pod` is set.
              environment:
                type: dict
                required: false
                default: {}
                description: Single-line non-secret environment values rendered literally
                  into the EnvironmentFile.
              environment_file:
                type: path
                required: true
                description: EnvironmentFile path for non-secret container configuration.
              secrets:
                type: list
                elements: dict
                required: true
                description: Podman secrets referenced by the Quadlet and managed in the
                  user's rootless context.
                mutually_exclusive:
                  - - value
                    - value_file
                required_one_of:
                  - - value
                    - value_file
                required_if:
                  - - type
                    - env
                    - - env_target
                options:
                  name:
                    type: str
                    required: true
                    description: Podman secret name.
                  value:
                    type: str
                    required: false
                    no_log: true
                    description: Optional desired content of the managed rootless Podman
                      secret.
                  value_file:
                    type: path
                    required: false
                    description: Optional remote file containing the secret value.
                  target:
                    type: str
                    required: false
                    description: 'Optional Podman secret mount target for `type: mount`.'
                  type:
                    type: str
                    required: false
                    default: mount
                    choices:
                      - mount
                      - env
                    description: Podman secret presentation type. Prefer `mount`; use `env`
                      only as a fallback.
                  env_target:
                    type: str
                    required: false
                    description: 'Environment variable name for `type: env`.'
              volumes:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `Volume=` values.
              ports:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `PublishPort=` values.
              networks:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `Network=` values.
              read_only:
                type: bool
                required: false
                default: true
                description: Value for Quadlet `ReadOnly=`.
              read_only_tmpfs:
                type: bool
                required: false
                default: true
                description: Value for Quadlet `ReadOnlyTmpfs=`.
              no_new_privileges:
                type: bool
                required: false
                default: true
                description: Value for Quadlet `NoNewPrivileges=`.
              drop_capabilities:
                type: list
                elements: str
                required: false
                default:
                  - all
                description: Capabilities rendered as repeated `DropCapability=` values.
              pids_limit:
                type: int
                required: false
                default: 512
                description: Value for Quadlet `PidsLimit=`.
              tmpfs:
                type: list
                elements: str
                required: false
                default: []
                description: Native Quadlet `Tmpfs=` values.
              restart_policy:
                type: str
                required: false
                default: always
                description: Systemd `Restart=` policy written to the Quadlet `[Service]`
                  section.
              exec:
                type: str
                required: false
                description: Arguments rendered as Quadlet `Exec=` after the image entrypoint.
              auto_update:
                type: str
                required: false
                choices:
                  - registry
                  - local
                description: Optional override for the global `quadlet_autoupdate` policy.
              unit_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Unit]` keys; list values render the key repeatedly.
              container_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Container]` keys; list values render the key repeatedly.
              service_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Service]` keys; list values render the key repeatedly.
              install_options:
                type: dict
                required: false
                default: {}
                description: Additional `[Install]` keys; list values render the key repeatedly.
              state:
                type: str
                required: false
                default: started
                choices:
                  - created
                  - reloaded
                  - restarted
                  - started
                  - stopped
                description: User service runtime state. `created` renders files without
                  managing the service.
              enabled:
                type: bool
                required: false
                default: true
                description: Whether `[Install]` enables the generated container service.
